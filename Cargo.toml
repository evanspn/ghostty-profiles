[package]
name = "ghostty-profiles"
version = "0.1.0"
edition = "2024"
description = "A TUI for browsing Ghostty themes and saving/switching complete look profiles (colors, fonts, shaders, background) with hot reload"
license = "MIT"
repository = "https://github.com/evanspn/ghostty-profiles"
keywords = ["ghostty", "tui", "terminal", "themes"]
categories = ["command-line-utilities"]
rust-version = "1.88"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
include_dir = "0.7.4"
ratatui = "0.30.2"

[dev-dependencies]
naga = { version = "29", features = ["glsl-in", "wgsl-out"] }
tempfile = "3.27.0"
