# description: PS3 clock: the time told only with light (hour = big orb near the rim, minute = smaller orb, second = small spark; the waves turn from night blue to day cyan to dusk amber). Needs zsh: while this look is active, each Ghostty shell runs a tiny background loop that writes the time into palette color 254 once a second (invisible); it stops by itself when you switch looks or close the shell. Applying hooks one line into ~/.zshrc (backed up); open a new tab after applying.
background = #04081a
foreground = #dfe8f0
cursor-color = #8fdcff
cursor-text = #04081a
selection-background = #1f4a7a
selection-foreground = #ffffff
palette = 0=#04081a
palette = 1=#ef7a8c
palette = 2=#8fd6b0
palette = 3=#e5cf94
palette = 4=#7aa8e8
palette = 5=#b3a0ee
palette = 6=#7fd6e8
palette = 7=#dfe8f0
palette = 8=#5d7184
palette = 9=#ff9aa8
palette = 10=#aaeacb
palette = 11=#f5e1b0
palette = 12=#a0c4f4
palette = 13=#cbbcf6
palette = 14=#a8ecf4
palette = 15=#ffffff
background-opacity = 0.92
custom-shader = shaders/ps3-clock.glsl
custom-shader-animation = true
